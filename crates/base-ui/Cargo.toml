[package]
name = "base-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base-core = { path = "../base-core" }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nokhwa = { version = "0.10", default-features = false, features = ["input-native"], optional = true }

[features]
# Live camera capture (nokhwa); the applications pass it on.
camera = ["dep:nokhwa"]
