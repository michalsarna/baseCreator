[package]
name = "base-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
roxmltree = "0.21.1"
i_overlay = "9.0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
lopdf = { version = "0.45", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
ron = "0.12"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
usvg = "0.48.1"
rhai = { version = "1.26.1", default-features = false, features = ["std", "no_module", "no_custom_syntax"] }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
flate2 = "1"
