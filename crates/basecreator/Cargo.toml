[package]
name = "basecreator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BaseCreator: an open-source drawing program that writes the project files of LightCreator, MillCreator and PenCreator"

[dependencies]
base-core = { path = "../base-core" }
base-ui = { path = "../base-ui" }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "x11", "wayland", "persistence", "links"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "0.37"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "BaseCreator"
identifier = "io.github.michalsarna.basecreator"
icon = ["../../assets/icons/icon-256.png", "../../assets/icons/icon-512.png"]
short_description = "Open-source drawing program"

[package.metadata.bundle.osx]
minimum_system_version = "11.0"

[package.metadata.deb]
name = "basecreator"
maintainer = "BaseCreator contributors <noreply@github.com>"
section = "graphics"
priority = "optional"
# The GUI loads libxkbcommon-x11 and libGL at run time, so list them explicitly.
depends = "$auto, libxkbcommon-x11-0, libgl1"
extended-description = "Draw shapes or import SVG, PDF, DXF and LightBurn files, and save the project files that LightCreator, MillCreator and PenCreator open."
assets = [
  ["target/release/basecreator", "usr/bin/", "755"],
  ["../../assets/basecreator.desktop", "usr/share/applications/", "644"],
  ["../../assets/icons/icon-48.png", "usr/share/icons/hicolor/48x48/apps/basecreator.png", "644"],
  ["../../assets/icons/icon-128.png", "usr/share/icons/hicolor/128x128/apps/basecreator.png", "644"],
  ["../../assets/icons/icon-256.png", "usr/share/icons/hicolor/256x256/apps/basecreator.png", "644"],
  ["../../assets/icons/icon-512.png", "usr/share/icons/hicolor/512x512/apps/basecreator.png", "644"],
  ["../../README.md", "usr/share/doc/basecreator/README.md", "644"],
  ["../../LICENSE", "usr/share/doc/basecreator/LICENSE", "644"],
  ["../../LICENSE-APACHE", "usr/share/doc/basecreator/LICENSE-APACHE", "644"],
]

[dev-dependencies]
# Renders the UI headlessly to PNG for the screenshots (see src/screenshots.rs).
egui_kittest = { version = "0.37", features = ["wgpu"] }
base-ui = { path = "../base-ui", features = ["tool-checks"] }
