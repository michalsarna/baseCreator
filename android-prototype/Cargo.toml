[package]
name = "bc-proto"
version = "0.1.0"
edition = "2021"

[lib]
name = "basecreator"
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-game-activity"] }
egui = "0.37"
log = "0.4"
winit = { version = "0.30", features = ["android-game-activity"] }
android_logger = "0.15"

# Not a member of the base workspace: built only with cargo-ndk.
[workspace]
