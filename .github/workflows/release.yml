name: Release BaseCreator

# Not every tag of baseCreator is a release of the program: the tags pin the libraries for the other programs and there can be several a day.
# A release is asked for by hand, for a tag that exists, and has its number: Actions > Release BaseCreator > Run workflow, or
#   gh workflow run release.yml -f tag=v1.59.0
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag of baseCreator to release, like v1.59.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: The tag must be on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: The tag must match the version in Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          [ "${TAG#v}" = "$v" ] || { echo "tag $TAG != Cargo.toml version $v"; exit 1; }
      - name: VERSIONS.md must say what is new
        run: grep -q "^## $TAG\b" VERSIONS.md

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, name: linux-x86_64, deb: amd64 }
          - { os: ubuntu-26.04-arm, name: linux-arm64, deb: arm64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-x11-dev libgl1-mesa-dev
      - run: cargo build --release -p basecreator

      # Plain archive (Linux .tar.gz, Windows .zip): binary + README + LICENSE. macOS gets only the .dmg.
      - name: Archive
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir dist
          cp README.md LICENSE LICENSE-APACHE dist/
          cp target/release/basecreator dist/ 2>/dev/null || cp target/release/basecreator.exe dist/
          name="basecreator-${TAG}-${{ matrix.name }}"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$name.zip" ./dist/*; else tar czf "$name.tar.gz" -C dist .; fi

      # Linux: .deb
      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p basecreator --no-build --output "basecreator-${TAG}-linux-${{ matrix.deb }}.deb"

      # Windows: NSIS installer (makensis is preinstalled on the runner image; install it if missing)
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress; $env:PATH += ";C:\Program Files (x86)\NSIS" }
          $version = $env:TAG.TrimStart('v')
          makensis /V2 "/DVERSION=$version" "/DOUTFILE=$PWD\basecreator-$env:TAG-windows-x86_64-setup.exe" packaging/windows/installer.nsi

      # macOS: .app bundle inside a .dmg
      - name: macOS app bundle and dmg
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --locked
          (cd crates/basecreator && cargo bundle --release)
          # Apple silicon refuses to run code without a valid signature; sign ad hoc (no developer account needed)
          codesign --force --deep --sign - target/release/bundle/osx/BaseCreator.app
          codesign --verify --deep --strict --verbose=2 target/release/bundle/osx/BaseCreator.app
          mkdir dmg && cp -R target/release/bundle/osx/BaseCreator.app dmg/ && ln -s /Applications dmg/Applications
          # The disk image tool is sometimes still busy with the volume cargo-bundle ejected ("Resource busy"): try again.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname BaseCreator -srcfolder dmg -ov -format UDZO "basecreator-${TAG}-${{ matrix.name }}.dmg" && break
            [ "$attempt" = 5 ] && exit 1
            sleep 10
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: basecreator-*

  release:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum basecreator-* > SHA256SUMS.txt
      - name: Release notes from VERSIONS.md
        run: awk -v t="## $TAG" 'index($0, t) == 1 { on = 1; next } /^## / { on = 0 } on' VERSIONS.md > notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: BaseCreator ${{ inputs.tag }}
          tag_name: ${{ inputs.tag }}
          body_path: notes.md
          files: |
            basecreator-*
            SHA256SUMS.txt

  # Package managers: the Homebrew tap, winget and the AUR follow every release. Each step runs only when its secret is set,
  # so a missing one never fails the release. The Scoop bucket updates itself (its own workflow).
  packages:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-26.04
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Checksums of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -p SHA256SUMS.txt

      # Homebrew: Casks/basecreator.rb in michalsarna/homebrew-tap gets the new version and both .dmg checksums.
      - name: Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          v="${TAG#v}"
          arm=$(grep -- '-macos-arm64.dmg$' SHA256SUMS.txt | cut -d' ' -f1)
          intel=$(grep -- '-macos-x86_64.dmg$' SHA256SUMS.txt | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/michalsarna/homebrew-tap.git" tap
          sed -i -E "s/^  version \".*\"/  version \"$v\"/; s/arm:   \"[0-9a-f]{64}\"/arm:   \"$arm\"/; s/intel: \"[0-9a-f]{64}\"/intel: \"$intel\"/" tap/Casks/basecreator.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Nothing to commit when the tap already has this version (a re-run, or a hand-made update).
          git diff --quiet || { git commit -am "basecreator $v" && git push; }

      # winget: opens a pull request in microsoft/winget-pkgs from the fork in the token owner's account. Works once the
      # first version of MichalSarna.BaseCreator has been merged there.
      - name: winget
        # Until the first version of the package has been accepted in microsoft/winget-pkgs this step is expected to fail.
        continue-on-error: true
        if: ${{ !cancelled() && env.WINGET_TOKEN != '' }}
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: MichalSarna.BaseCreator
          installers-regex: '-setup\.exe$'
          release-tag: ${{ inputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}

      # AUR: basecreator-bin, built from the .deb files of the release (packaging/aur/PKGBUILD; checksums are filled in).
      - name: AUR package
        if: ${{ !cancelled() && env.AUR_SSH_PRIVATE_KEY != '' }}
        run: sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
      - if: ${{ !cancelled() && env.AUR_SSH_PRIVATE_KEY != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: basecreator-bin
          pkgbuild: packaging/aur/PKGBUILD
          updpkgsums: true
          commit_username: Michał Sarna
          commit_email: 5010807+michalsarna@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ inputs.tag }}"
